name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://prisma:password@localhost:5432/nova_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.2

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm run lint

      - name: Run Strict Type Check
        run: pnpm run typecheck

      - name: Setup Database
        run: |
          pnpm --filter @nova/api prisma migrate dev
          pnpm --filter @nova/api prisma db seed

      - name: Run Unit and Integration Tests
        run: pnpm --filter @nova/api test

      - name: Install Playwright Browsers
        run: pnpm --filter @nova/web exec playwright install --with-deps

      - name: Run E2E Tests
        run: pnpm --filter @nova/web test
        env:
          CI: true

      - name: Production Build
        run: pnpm run build
